plugins {
    alias(libs.plugins.moddevgradle)
    id 'maven-publish'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

version = project.mod_version
group = 'com.lgmrszd.compressedcreativity'
base {
    archivesName = 'CompressedCreativity'
}

dependencies {
    // Create mod via Curse Maven - Create 6.0.9 for mc1.21.1
    implementation "curse.maven:create-328085:7408951"
    
    // PneumaticCraft via Curse Maven - PneumaticCraft 8.2.16 for mc1.21.1  
    implementation "curse.maven:pneumaticcraft-repressurized-281849:7535029"
    
    // Registrate - extracted from Create's JarJar bundle (MC1.21-1.3.0+67)
    implementation files("${rootProject.projectDir}/libs/Registrate-MC1.21-1.3.0+67.jar")
    
    // Ponder - extracted from Create's JarJar bundle (contains net.createmod.ponder and net.createmod.catnip)
    implementation files("${rootProject.projectDir}/libs/ponder-neoforge-1.0.81+mc1.21.1.jar")
    
    // Flywheel - extracted from Create's JarJar bundle (rendering library)
    implementation files("${rootProject.projectDir}/libs/flywheel-neoforge-1.21.1-1.0.6.jar")
}

neoForge {
    version = libs.versions.neoforge.get()
    
    runs {
        client {
            client()
        }
        
        server {
            server()
        }
        
        data {
            data()
            programArguments.addAll '--mod', 'compressedcreativity',
                '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
    
    mods {
        compressedcreativity {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir "src/generated/resources"

tasks.withType(ProcessResources) {
    duplicatesStrategy = 'exclude'
}

repositories {
    maven {
        name = "tterrag Maven"
        url = "https://maven.tterrag.com/"
    }
    maven {
        name = "Curse Maven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "JitPack"
        url = "https://jitpack.io"
    }
}
